<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Vendetta</title>
<!-- The original executable's icon, a 16×16 crown, also scaled up pixel by pixel. -->
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
  /* The loading screen (`Afficher_Image_Chargement`): a random artwork letterboxed to 4:3,
     a progress bar behind its bottom band, and a bubble saying what is loading. It is
     shown before the game has even downloaded, and removed when the game is ready. */
  #loading { position: fixed; inset: 0; z-index: 1; background: #000;
             display: flex; align-items: center; justify-content: center; }
  #frame { position: relative; width: min(100vw, calc(100vh * 4 / 3)); aspect-ratio: 4 / 3; }
  #bar { position: absolute; left: 0; bottom: 0; height: calc(97 / 768 * 100%); width: 0;
         background: rgb(6, 249, 0); }
  #art { position: absolute; inset: 0; width: 100%; height: 100%; }
  #bubble { position: fixed; left: 24px; top: 20px; z-index: 2; pointer-events: none;
            background: rgb(255, 255, 192); border: 1px solid #000; padding: 1px 2px;
            color: #000; font: bold 13px Arial, "Liberation Sans", sans-serif; line-height: 16px;
            white-space: pre; }
  #bubble .red { color: #f00; }
  /* The pre-game menu: the solo game's settings, kept in the address's hash. */
  #menu { position: fixed; inset: 0; z-index: 3; display: flex; align-items: center;
          justify-content: center; background: #000;
          font: 15px Arial, "Liberation Sans", sans-serif; color: #e8e8d0; }
  #menu[hidden], #loading[hidden] { display: none; }
  #menu form, #main { background: rgb(52, 70, 34); border: 3px solid rgb(120, 150, 70);
               border-radius: 12px; padding: 20px 28px; min-width: 300px; }
  #menu h1 { margin: 0 0 16px; font-size: 22px; text-align: center; }
  #menu label { display: grid; grid-template-columns: 1fr 200px; align-items: center;
                gap: 16px; margin: 8px 0; }
  #menu input[type=number], #menu select { width: 100%; box-sizing: border-box; font: inherit; }
  #menu input[type=checkbox] { justify-self: start; margin: 0; }
  /* only a line above, so that its fields stay in the form's columns */
  #menu fieldset { border: none; border-top: 1px solid rgb(120, 150, 70); margin: 14px 0 0; padding: 0; }
  #menu .buttons { display: flex; gap: 12px; justify-content: center; margin-top: 18px; }
  #menu button { font: bold 15px Arial, "Liberation Sans", sans-serif; padding: 6px 14px; }
  #main { display: flex; flex-direction: column; gap: 12px; }
  #main[hidden], #menu form[hidden] { display: none; }
  #main button { padding: 10px 14px; }
  /* Network play: entering a room, then the room itself. */
  #lobby { background: rgb(52, 70, 34); border: 3px solid rgb(120, 150, 70);
           border-radius: 12px; padding: 20px 28px; min-width: 360px; }
  #lobby[hidden], #lobby > div[hidden], #lobby [hidden] { display: none; }
  #lobby input[type=text] { width: 100%; box-sizing: border-box; font: inherit; }
  #lobby .code { font: bold 28px monospace; letter-spacing: 4px; }
  #lobby .error { color: #ff8080; min-height: 1.2em; margin: 8px 0 0; text-align: center; }
  #lobby table { width: 100%; border-collapse: collapse; margin: 8px 0; }
  #lobby td { padding: 3px 4px; }
  #lobby tr.offline { color: #999; }
  #lobby .link { font-size: 12px; word-break: break-all; }
</style>
</head>
<body>
<div id="menu" hidden>
  <div id="main">
    <h1>Vendetta</h1>
    <button type="button" id="continue" disabled>Continuer</button>
    <button type="button" id="new">Nouveau</button>
    <button type="button" id="multi">Multijoueur</button>
  </div>
  <div id="lobby" hidden>
    <h1>Multijoueur</h1>
    <div id="enter">
      <label>Votre nom <input type="text" id="name" maxlength="24"></label>
      <div class="buttons"><button type="button" id="create">Créer une partie</button></div>
      <label>Code de la partie <input type="text" id="code" maxlength="8" autocapitalize="characters"></label>
      <div class="buttons">
        <button type="button" id="lobby-back">Retour</button>
        <button type="button" id="join">Rejoindre</button>
      </div>
    </div>
    <div id="room" hidden>
      <div>Partie <span class="code" id="room-code"></span></div>
      <div class="link">Lien à partager : <a id="room-link"></a></div>
      <table id="players"></table>
      <fieldset id="room-settings"><legend>Monde (choisi par l'hôte)</legend>
        <label>Taille de la carte
          <select name="size">
            <option value="128">128 × 128</option><option value="192">192 × 192</option>
            <option value="256">256 × 256</option><option value="384">384 × 384</option>
            <option value="512">512 × 512</option><option value="640">640 × 640</option>
            <option value="768">768 × 768</option><option value="1024">1024 × 1024</option>
          </select></label>
        <label>Peuples <input type="number" name="fiefs" min="2" max="200" placeholder="4"></label>
        <label>Villageois par peuple <input type="number" name="villagers" min="1" max="2000" placeholder="10"></label>
        <label>Routes
          <select name="roads">
            <option value="">vers les châteaux proches</option>
            <option value="ring">en anneau (l'original)</option>
          </select></label>
        <label>Graine <input type="number" name="seed" min="0" placeholder="au hasard"></label>
      </fieldset>
      <div class="buttons">
        <button type="button" id="leave">Quitter</button>
        <button type="button" id="room-start">Jouer</button>
      </div>
    </div>
    <p class="error" id="lobby-error"></p>
  </div>
  <form hidden>
    <h1>Vendetta</h1>
    <label>Taille de la carte
      <select name="size">
        <option value="128">128 × 128</option><option value="192">192 × 192</option>
        <option value="256">256 × 256</option><option value="384">384 × 384</option>
        <option value="512">512 × 512</option><option value="640">640 × 640</option>
        <option value="768">768 × 768</option><option value="1024">1024 × 1024</option>
      </select></label>
    <label>Peuples <input type="number" name="fiefs" min="2" max="200" placeholder="4"></label>
    <label>Villageois par peuple <input type="number" name="villagers" min="1" max="2000" placeholder="10"></label>
    <label>Routes
      <select name="roads">
        <option value="">vers les châteaux proches</option>
        <option value="ring">en anneau (l'original)</option>
      </select></label>
    <label>Graine <input type="number" name="seed" min="0" placeholder="au hasard"></label>
    <fieldset><legend>Tests</legend>
      <label>Invincible <input type="checkbox" name="god"></label>
      <label>Performances <input type="checkbox" name="perf"></label>
    </fieldset>
    <div class="buttons">
      <button type="button" id="back">Retour</button>
      <button type="submit">Jouer</button>
    </div>
  </form>
</div>
<div id="loading" hidden>
  <div id="frame"><div id="bar"></div><img id="art" alt=""></div>
</div>
<div id="bubble" hidden>Chargement…</div>
<canvas id="glcanvas" tabindex="1" oncontextmenu="event.preventDefault()"></canvas>
<!-- build-web.sh appends ?v=<hash> to these two URLs so they can be cached for good -->
<script src="mq_js_bundle.js"></script>
<script>
  // Digits are the object keys: keep Firefox's quick find (' is 4 on AZERTY, /) and similar
  // shortcuts from taking them.
  window.addEventListener("keydown", (e) => {
    if (e.target.closest && e.target.closest("form, #lobby")) return; // the menu's fields
    if (/^(Digit\d|Quote|Slash)$/.test(e.code) && !e.ctrlKey && !e.metaKey) e.preventDefault();
  });
</script>
<script>
  // Right click is a game action, not the browser menu.
  document.addEventListener("contextmenu", (e) => e.preventDefault());

  const loadingScreen = document.getElementById("loading");
  const bar = document.getElementById("bar");
  const bubble = document.getElementById("bubble");

  // Progress in bytes: the game's own download (measured here), then the files the game
  // downloads (reported by it). Until it reports, its share is estimated from the manifest.
  const bytes = { wasm: 0, wasmTotal: 0, game: 0, gameTotal: 0 };
  let shown = 0;
  function showProgress() {
    const total = bytes.wasmTotal + bytes.gameTotal;
    const pct = total > 0 ? (100 * (bytes.wasm + bytes.game)) / total : 0;
    shown = Math.max(shown, Math.min(pct, 100)); // never goes backwards
    bar.style.width = shown + "%";
    bar.style.background = `hsl(${shown * 1.2}, 100%, 45%)`; // smooth red to green
  }

  // The manifest gives a random artwork (the bar works without it) and the estimate:
  // data files plus the image folders the game always loads (see Manifest in assets.rs).
  fetch("assets/manifest.txt")
    .then((r) => r.text())
    .then((text) => {
      const entries = text.split("\n").filter((l) => l).map((l) => {
        const [path, size, hash] = l.split("\t");
        return { path, size: Number(size) || 0, url: "assets/" + path + (hash ? "?v=" + hash : "") };
      });
      const arts = entries.filter((e) => e.path.startsWith("Images/Chargement/"));
      if (arts.length > 0) {
        const pick = arts[Math.floor(Math.random() * arts.length)];
        document.getElementById("art").src = pick.url;
      }
      if (bytes.gameTotal === 0) {
        const lower = (p) => p.toLowerCase();
        const isData = (p) =>
          (/\.(ini|txt|ia)$/.test(lower(p)) || lower(p).startsWith("cartes/") || lower(p).startsWith("sons/")) &&
          !/(apercu|carte)\.png$/.test(lower(p));
        const folders = ["Images/Batiments/", "Images/Persos/", "Images/Apparences/", "Images/Effets/",
                         "Images/Boutons/", "Images/Decors/", "Images/Terrains/",
                         "Images/Fenetres/Fenetre-", "Images/Ressources/", "Images/Curseurs/"];
        bytes.gameTotal = entries
          .filter((e) => isData(e.path) || folders.some((f) => e.path.startsWith(f)))
          .reduce((sum, e) => sum + e.size, 0);
        showProgress();
      }
    })
    .catch(() => {});

  // The bubble follows the cursor, like the original's info-bubbles.
  document.addEventListener("mousemove", (e) => {
    bubble.style.left = e.clientX + 24 + "px";
    bubble.style.top = e.clientY + 20 + "px";
  });

  // `#` separates lines; a line starting with `&` is red.
  function showMessage(text) {
    bubble.replaceChildren();
    text.split("#").forEach((line, i) => {
      if (i > 0) bubble.append("\n");
      const span = document.createElement("span");
      if (line.startsWith("&")) {
        span.className = "red";
        line = line.slice(1);
      }
      span.textContent = line;
      bubble.append(span);
    });
    bubble.style.display = text ? "" : "none";
  }

  // Called by the game while it loads (see client/src/loading.rs).
  miniquad_add_plugin({
    name: "vendetta_loading",
    version: 1,
    register_plugin: (importObject) => {
      importObject.env.vendetta_loading = (done, total, ptr, len) => {
        if (total > 0) {
          // until the game knows its sizes, keep the estimate
          bytes.game = done;
          bytes.gameTotal = total;
        }
        showProgress();
        showMessage(UTF8ToString(ptr, len));
      };
      importObject.env.vendetta_loaded = () => {
        loadingScreen.remove();
        bubble.remove();
      };

      // Persistent blobs (see client/src/storage.rs and `storageReady` below), read from
      // memory; writes go on to IndexedDB in the background.
      let pendingRead = null;
      importObject.env.vendetta_store = (kptr, klen, ptr, len) => {
        const key = UTF8ToString(kptr, klen);
        // the only copy: it goes to the worker, which hands it back for `blobs`
        const value = new Uint8Array(wasm_memory.buffer, ptr, len).slice();
        if (worker) persist(key, value);
        else blobs.set(key, value);
      };
      importObject.env.vendetta_stored_size = (kptr, klen) => {
        const key = UTF8ToString(kptr, klen);
        pendingRead = blobs.get(key);
        return pendingRead ? pendingRead.length : 0;
      };
      // A precise clock for the #perf timings (macroquad's uses Date.now(), to the millisecond).
      importObject.env.vendetta_now = () => performance.now() / 1000;
      // Options in the URL's hash (see client/src/options.rs), read like a stored value.
      importObject.env.vendetta_hash_size = () => {
        pendingRead = new TextEncoder().encode(startHash);
        return pendingRead.length;
      };
      // Network play (see client/src/net.rs and the lobby below): messages for the game wait
      // in `netInbox`.
      importObject.env.vendetta_net_send = (ptr, len) => {
        if (socket && socket.readyState === WebSocket.OPEN) socket.send(UTF8ToString(ptr, len));
      };
      importObject.env.vendetta_net_size = () => {
        const msg = netInbox.shift();
        if (msg === undefined) return 0;
        pendingRead = new TextEncoder().encode(msg);
        return pendingRead.length;
      };
      // after the pending writes, so that none is lost
      window.addEventListener("hashchange", () => writesDone().then(() => location.reload()));
      importObject.env.vendetta_read = (ptr) => {
        new Uint8Array(wasm_memory.buffer, ptr, pendingRead.length).set(pendingRead);
        pendingRead = null;
      };
    },
  });

  // The options in the URL's hash (see client/src/options.rs), which the game reads as it
  // starts. `play` starts it at once; without it, the pre-game menu shows them and every change
  // rewrites the hash in place. `new` (a new world) applies to one start only: it is taken out
  // of the address, so that reloading resumes that world.
  const hashItems = () => decodeURIComponent(location.hash.slice(1)).split("&").filter((o) => o);
  const setHash = (items) => history.replaceState(null, "", location.pathname + location.search + (items.length ? "#" + items.join("&") : ""));
  let startHash = "";
  // The settings the game in progress was started with, for "Continuer la partie".
  const lastKey = "vendetta-game";
  // Network play: the server connection, kept once the game starts, and the messages waiting
  // for the game (see the lobby below).
  let socket = null;
  const netInbox = [];
  let netStarted = false;
  function begin(items) {
    const kept = items.filter((o) => o !== "new");
    try {
      localStorage.setItem(lastKey, kept.filter((o) => o !== "play").join("&"));
    } catch (e) {}
    startHash = items.join("&");
    setHash(kept);
    document.getElementById("menu").hidden = true;
    loadingScreen.hidden = false;
    bubble.hidden = false;
    startGame();
  }

  // Persistent blobs: gzip-compressed in IndexedDB (database "vendetta", store "blobs"),
  // which unlike local storage holds big worlds. They are all read into `blobs` before the
  // game starts, so that it reads them synchronously. A worker compresses and stores writes,
  // off the game's thread; while one is in progress, only the newest value of each key waits.
  // Storage may be unavailable (private browsing): then nothing persists.
  const blobs = new Map();
  let db = null;
  const openDb = () =>
    new Promise((resolve, reject) => {
      const open = indexedDB.open("vendetta", 1);
      open.onupgradeneeded = () => open.result.createObjectStore("blobs");
      open.onsuccess = () => resolve(open.result);
      open.onerror = () => reject(open.error);
    });
  const transform = async (data, stream) =>
    new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(stream)).arrayBuffer());
  const request = (db, mode, op) =>
    new Promise((resolve, reject) => {
      const tx = db.transaction("blobs", mode);
      const req = op(tx.objectStore("blobs"));
      tx.oncomplete = () => resolve(req.result);
      tx.onerror = tx.onabort = () => reject(tx.error);
    });
  const workerCode = `
    ${openDb.toString().replace(/^/, "const openDb = ")};
    ${transform.toString().replace(/^/, "const transform = ")};
    ${request.toString().replace(/^/, "const request = ")};
    const db = openDb();
    onmessage = async ({ data: { key, value } }) => {
      try {
        const packed = await transform(value, new CompressionStream("gzip"));
        await request(await db, "readwrite", (s) => s.put(packed, key));
        postMessage({ key, value }, [value.buffer]);
      } catch (e) {
        postMessage({ key, value, error: String(e) }, [value.buffer]);
      }
    };`;
  let worker = null;
  const waiting = new Map(); // key → newest value not yet sent to the worker
  const busy = new Set();
  let onIdle = [];
  const send = (key) => {
    if (busy.has(key) || !waiting.has(key)) return;
    const value = waiting.get(key);
    waiting.delete(key);
    busy.add(key);
    worker.postMessage({ key, value }, [value.buffer]);
  };
  /// Hands `value` to the worker; `blobs` gets it back once stored (the game reads blobs only
  /// as it starts, so the old value meanwhile does not matter).
  const persist = (key, value) => {
    waiting.set(key, value);
    send(key);
  };
  /// Resolves once every write is stored.
  const writesDone = () =>
    busy.size === 0 && waiting.size === 0 ? Promise.resolve() : new Promise((r) => onIdle.push(r));
  const storageReady = (async () => {
    try {
      db = await openDb();
      const [keys, values] = await Promise.all([
        request(db, "readonly", (s) => s.getAllKeys()),
        request(db, "readonly", (s) => s.getAll()),
      ]);
      for (let i = 0; i < keys.length; i++) {
        blobs.set(keys[i], await transform(values[i], new DecompressionStream("gzip")));
      }
      worker = new Worker(URL.createObjectURL(new Blob([workerCode], { type: "text/javascript" })));
      worker.onmessage = ({ data: { key, value, error } }) => {
        if (error) console.warn("cannot save " + key + ":", error);
        if (!waiting.has(key)) blobs.set(key, value);
        busy.delete(key);
        send(key);
        if (busy.size === 0 && waiting.size === 0) onIdle.splice(0).forEach((r) => r());
      };
    } catch (e) {
      console.warn("no storage:", e);
    }
  })();

  // Download the game ourselves to show its progress, then hand it to miniquad's loader.
  const startGame = async () => {
    try {
      const response = await fetch("client.wasm");
      if (!response.ok) throw new Error(`client.wasm: ${response.status}`);
      bytes.wasmTotal = Number(response.headers.get("Content-Length")) || 2000000;
      const reader = response.body.getReader();
      const chunks = [];
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        bytes.wasm += value.length;
        bytes.wasmTotal = Math.max(bytes.wasmTotal, bytes.wasm);
        showProgress();
      }
      bytes.wasmTotal = bytes.wasm;
      await storageReady;
      load(URL.createObjectURL(new Blob(chunks, { type: "application/wasm" })));
    } catch (e) {
      showMessage("&Erreur#" + e.message);
    }
  };

  // The pre-game menu: the form mirrors the hash; flags are checkboxes, other keys values.
  {
    const form = document.querySelector("#menu form");
    const fields = ["size", "fiefs", "villagers", "roads", "seed"];
    const flags = ["god", "perf"];
    const fill = () => {
      const items = hashItems();
      const value = (k) => (items.find((o) => o.startsWith(k + "=")) || "").slice(k.length + 1);
      for (const k of fields) form.elements[k].value = value(k);
      if (!form.elements.size.value) form.elements.size.value = "128";
      for (const k of flags) form.elements[k].checked = items.includes(k);
    };
    // the menu's items, the hash's other ones kept (e.g. `test`)
    const items = () => {
      const ours = (o) => fields.some((k) => o.startsWith(k + "=")) || flags.includes(o) || o === "play" || o === "new";
      const out = hashItems().filter((o) => !ours(o));
      for (const k of fields) {
        const v = String(form.elements[k].value).trim();
        if (v && !(k === "size" && v === "128")) out.push(k + "=" + v);
      }
      for (const k of flags) if (form.elements[k].checked) out.push(k);
      return out;
    };
    form.addEventListener("input", () => setHash(items()));
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      begin([...items(), "play", "new"]);
    });
    document.getElementById("continue").addEventListener("click", () => {
      let last = "";
      try {
        last = localStorage.getItem(lastKey) || "";
      } catch (e) {}
      begin([...last.split("&").filter((o) => o), "play"]);
    });
    // The main menu ("Continuer", greyed without a saved game; "Nouveau") and the form.
    const main = document.getElementById("main");
    const show = (onForm) => {
      main.hidden = onForm;
      form.hidden = !onForm;
    };
    document.getElementById("new").addEventListener("click", () => show(true));
    document.getElementById("back").addEventListener("click", () => show(false));

    // Network play (see the server crate): enter a room by creating one or with its code (or a
    // link with `#room=CODE`), pick a fief; the host sets the world and starts.
    const $ = (id) => document.getElementById(id);
    const lobby = $("lobby");
    const settings = $("room-settings");
    const nameKey = "vendetta-name";
    const fail = (text) => ($("lobby-error").textContent = text);
    const inRoom = (yes) => {
      $("enter").hidden = yes;
      $("room").hidden = !yes;
    };
    const send = (msg) => socket && socket.readyState === WebSocket.OPEN && socket.send(JSON.stringify(msg));
    const roomValue = (items, k) => (items.find((o) => o.startsWith(k + "=")) || "").slice(k.length + 1);
    const showLobby = (msg) => {
      setHash(["room=" + msg.room]);
      inRoom(true);
      $("room-code").textContent = msg.room;
      $("room-link").href = $("room-link").textContent = location.href;
      const host = msg.you === msg.host;
      for (const k of fields) {
        const el = settings.elements[k];
        if (el !== document.activeElement) el.value = roomValue(msg.items, k) || (k === "size" ? "128" : "");
        el.disabled = !host;
      }
      const fiefs = Number(roomValue(msg.items, "fiefs")) || 4;
      $("players").replaceChildren(
        ...msg.players.map((p, k) => {
          const row = document.createElement("tr");
          if (!p.online) row.className = "offline";
          const name = document.createElement("td");
          name.textContent = p.name + (k === msg.host ? " (hôte)" : "") + (k === msg.you ? " (vous)" : "");
          const fief = document.createElement("td");
          if (k === msg.you) {
            const select = document.createElement("select");
            for (let f = 1; f <= fiefs; f++) select.add(new Option("Peuple " + f, f, false, f === p.fief));
            select.addEventListener("change", () => send({ t: "fief", fief: Number(select.value) }));
            fief.append(select);
          } else {
            fief.textContent = "Peuple " + p.fief;
          }
          row.append(name, fief);
          return row;
        }),
      );
      $("room-start").hidden = !host;
    };
    // The world: the room's options, its seed, everyone's fief and our place.
    const startNet = (msg) => {
      netStarted = true;
      startHash = [...msg.items, "seed=" + msg.seed, "players=" + msg.players.join("+"), "me=" + msg.you, "play"].join("&");
      document.getElementById("menu").hidden = true;
      loadingScreen.hidden = false;
      bubble.hidden = false;
      startGame();
    };
    // Connects to the server (`ws` next to the page), then sends `first`.
    const connect = (first) => {
      fail("");
      if (socket) socket.close();
      const url = new URL("ws", location.href);
      url.protocol = url.protocol === "https:" ? "wss:" : "ws:";
      url.hash = url.search = "";
      const ws = new WebSocket(url);
      socket = ws;
      ws.onopen = () => send(first);
      ws.onerror = () => fail("Le serveur ne répond pas.");
      ws.onclose = () => {
        if (socket !== ws) return;
        socket = null;
        if (netStarted) netInbox.push('{"t":"closed"}');
        else inRoom(false);
      };
      ws.onmessage = ({ data }) => {
        if (netStarted) return netInbox.push(data);
        const msg = JSON.parse(data);
        if (msg.t === "error") fail(msg.message.charAt(0).toUpperCase() + msg.message.slice(1) + ".");
        else if (msg.t === "lobby") showLobby(msg);
        else if (msg.t === "start") startNet(msg);
      };
    };
    const name = () => {
      const n = $("name").value.trim();
      if (!n) fail("Choisissez un nom.");
      try {
        localStorage.setItem(nameKey, n);
      } catch (e) {}
      return n;
    };
    $("create").addEventListener("click", () => name() && connect({ t: "create", name: name() }));
    $("join").addEventListener("click", () => {
      const code = $("code").value.trim().toUpperCase();
      if (!code) return fail("Entrez le code de la partie.");
      if (name()) connect({ t: "join", room: code, name: name() });
    });
    $("leave").addEventListener("click", () => {
      const ws = socket;
      socket = null;
      if (ws) ws.close();
      inRoom(false);
      setHash([]);
    });
    $("room-start").addEventListener("click", () => send({ t: "start" }));
    settings.addEventListener("input", () => {
      const items = [];
      for (const k of fields) {
        const v = String(settings.elements[k].value).trim();
        if (v && !(k === "size" && v === "128")) items.push(k + "=" + v);
      }
      send({ t: "settings", items });
    });
    const openLobby = (code) => {
      main.hidden = form.hidden = true;
      lobby.hidden = false;
      try {
        $("name").value = localStorage.getItem(nameKey) || "";
      } catch (e) {}
      $("code").value = code;
      if (code && $("name").value.trim()) $("join").click();
    };
    $("lobby-back").addEventListener("click", () => {
      lobby.hidden = true;
      show(false);
    });
    $("multi").addEventListener("click", () => openLobby(""));
    // a page opened as a file has no server
    $("multi").hidden = location.protocol === "file:";

    const room = roomValue(hashItems(), "room");
    if (hashItems().includes("play")) {
      begin(hashItems());
    } else if (room) {
      document.getElementById("menu").hidden = false;
      openLobby(room);
    } else {
      fill();
      document.getElementById("menu").hidden = false;
      // a link with settings opens on the form
      show(hashItems().some((o) => fields.some((k) => o.startsWith(k + "=")) || flags.includes(o)));
      storageReady.then(() => {
        document.getElementById("continue").disabled = !blobs.has("save");
      });
    }
  }
</script>
</body>
</html>
