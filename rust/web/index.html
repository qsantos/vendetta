<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- phones: the page at the screen's width, not zoomed by the browser (the game zooms itself) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Vendetta</title>
<!-- The original executable's icon, a 16×16 crown, also scaled up pixel by pixel. -->
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* the game takes the touches: no scrolling, zooming or double-tap zoom of the page */
  canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  /* the game loads behind the menus: nothing to show (or composite) until one is started */
  canvas.waiting { visibility: hidden; }
  /* it has the keyboard while shown: no focus ring around the game */
  canvas:focus { outline: none; }
  /* The loading screen (`Afficher_Image_Chargement`): a random artwork letterboxed to 4:3,
     a progress bar behind its bottom band, and a bubble saying what is loading. It is
     shown before the game has even downloaded, and removed when the game is ready. */
  #loading { position: fixed; inset: 0; z-index: 1; background: #000;
             display: flex; align-items: center; justify-content: center; }
  #frame { position: relative; width: min(100vw, calc(100vh * 4 / 3)); aspect-ratio: 4 / 3; }
  #bar { position: absolute; left: 0; bottom: 0; height: calc(97 / 768 * 100%); width: 0;
         background: rgb(6, 249, 0); }
  #art { position: absolute; inset: 0; width: 100%; height: 100%; }
  #bubble { position: fixed; left: 24px; top: 20px; z-index: 2; pointer-events: none;
            background: rgb(255, 255, 192); border: 1px solid #000; padding: 1px 2px;
            color: #000; font: bold 13px Arial, "Liberation Sans", sans-serif; line-height: 16px;
            white-space: pre-wrap; overflow-wrap: anywhere; max-width: min(50ch, calc(100vw - 54px)); }
  #bubble .red { color: #f00; }
  /* Errors (a crash of the game, a failing script), shown over everything: on a phone there
     is no console to read them in. A tap dismisses them. */
  #errors { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 10; max-height: 50vh;
            overflow: auto; background: #fff; color: #c00; border: 2px solid #c00; padding: 6px;
            font: 12px monospace; white-space: pre-wrap; word-break: break-word; }
  #errors[hidden] { display: none; }
  #netstatus { position: fixed; left: 24px; top: 4px; z-index: 2; color: #fc6;
               font: bold 12px Arial, "Liberation Sans", sans-serif; pointer-events: none; }
  #netstatus[hidden] { display: none; }
  /* The pre-game menu: the solo game's settings, kept in the address's hash. */
  #menu { position: fixed; inset: 0; z-index: 3; display: flex; align-items: center;
          justify-content: center; background: #000;
          font: 15px Arial, "Liberation Sans", sans-serif; color: #e8e8d0; }
  #menu[hidden], #loading[hidden] { display: none; }
  #menu form, #main { background: rgb(52, 70, 34); border: 3px solid rgb(120, 150, 70);
               border-radius: 12px; padding: 20px 28px; min-width: 300px; }
  #menu h1 { margin: 0 0 16px; font-size: 22px; text-align: center; }
  #menu label { display: grid; grid-template-columns: 1fr 200px; align-items: center;
                gap: 16px; margin: 8px 0; }
  #menu input[type=number], #menu select { width: 100%; box-sizing: border-box; font: inherit; }
  #menu input[type=checkbox] { justify-self: start; margin: 0; }
  /* only a line above, so that its fields stay in the form's columns */
  #menu fieldset { border: none; border-top: 1px solid rgb(120, 150, 70); margin: 14px 0 0; padding: 0; }
  #menu .buttons { display: flex; gap: 12px; justify-content: center; margin-top: 18px; }
  #menu button { font: bold 15px Arial, "Liberation Sans", sans-serif; padding: 6px 14px; }
  #main { display: flex; flex-direction: column; gap: 12px; }
  #main[hidden], #menu form[hidden] { display: none; }
  #main button { padding: 10px 14px; }
  /* Network play: entering a room, then the room itself. */
  #lobby { background: rgb(52, 70, 34); border: 3px solid rgb(120, 150, 70);
           border-radius: 12px; padding: 20px 28px; min-width: 360px; }
  #lobby[hidden], #lobby > div[hidden], #lobby [hidden] { display: none; }
  #lobby input[type=text] { width: 100%; box-sizing: border-box; font: inherit; }
  #lobby .code { font: bold 28px monospace; letter-spacing: 4px; }
  #lobby .error { color: #ff8080; min-height: 1.2em; margin: 8px 0 0; text-align: center; }
  #lobby table { width: 100%; border-collapse: collapse; margin: 8px 0; }
  #lobby td { padding: 3px 4px; }
  #lobby tr.offline { color: #999; }
  #lobby .link { font-size: 12px; word-break: break-all; }
  /* The in-game menu, over the game (which a solo game pauses behind it). */
  #ingame { position: fixed; inset: 0; z-index: 4; display: flex; align-items: center;
            justify-content: center; background: rgba(0, 0, 0, 0.5);
            font: 15px Arial, "Liberation Sans", sans-serif; color: #e8e8d0; }
  #ingame[hidden], #ingame [hidden] { display: none !important; }
  #ingame .panel { background: rgb(52, 70, 34); border: 3px solid rgb(120, 150, 70); border-radius: 12px;
                   padding: 20px 28px; display: flex; flex-direction: column; gap: 12px;
                   width: min(calc(100vw - 24px), 320px); box-sizing: border-box; max-height: calc(100vh - 24px);
                   overflow-y: auto; }
  #ingame .actions { display: flex; flex-direction: column; gap: 12px; }
  #ingame h1 { margin: 0; font-size: 22px; text-align: center; }
  /* a phone held sideways: the actions left of the settings */
  @media (orientation: landscape) and (max-height: 480px) {
    #ingame .panel { flex-direction: row; gap: 24px; width: min(calc(100vw - 24px), 640px); padding: 12px 20px; }
    #ingame .actions, #ingame .settings { flex: 1; }
    #ingame .actions { justify-content: center; }
  }
  #ingame .note { margin: 0; text-align: center; font-size: 13px; color: #c8c8b0; }
  #ingame button { font: bold 15px Arial, "Liberation Sans", sans-serif; padding: 10px 14px; }
  #ingame fieldset { border: none; border-top: 1px solid rgb(120, 150, 70); margin: 4px 0 0; padding: 6px 0 0; }
  #ingame legend { padding: 0 6px 0 0; }
  #ingame label { display: grid; grid-template-columns: auto 1fr 45%; align-items: center; gap: 8px; margin: 8px 0; }
  #ingame input[type=checkbox] { width: 20px; height: 20px; margin: 0; }
  #ingame input[type=range] { width: 100%; margin: 0; }
  #ingame .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0; }
  #ingame .row button { padding: 4px 0; width: 40px; margin-left: 6px; }
  #ingame select { font: inherit; }
  /* Small screens (phones): the menus keep off the edges, and scroll when taller than it. */
  @media (max-width: 480px), (max-height: 480px) {
    #menu { overflow-y: auto; align-items: safe center; }
    #menu form, #main, #lobby { min-width: 0; width: min(calc(100vw - 24px), 440px); box-sizing: border-box;
                                padding: 12px 16px; margin: 12px auto; }
    #menu label { grid-template-columns: 1fr 55%; gap: 8px; }
  }
</style>
</head>
<body>
<div id="menu" hidden>
  <div id="main">
    <h1>Vendetta</h1>
    <button type="button" id="continue" disabled>Continuer</button>
    <button type="button" id="new">Nouveau</button>
    <button type="button" id="multi">Multijoueur</button>
  </div>
  <div id="lobby" hidden>
    <h1>Multijoueur</h1>
    <div id="enter">
      <label>Votre nom <input type="text" id="name" maxlength="24"></label>
      <div class="buttons"><button type="button" id="create">Créer une partie</button></div>
      <label>Code de la partie <input type="text" id="code" maxlength="8" autocapitalize="characters"></label>
      <div class="buttons">
        <button type="button" id="lobby-back">Retour</button>
        <button type="button" id="join">Rejoindre</button>
      </div>
    </div>
    <div id="room" hidden>
      <div>Partie <span class="code" id="room-code"></span></div>
      <div class="link">Lien à partager : <a id="room-link"></a></div>
      <table id="players"></table>
      <fieldset id="room-settings"><legend>Monde (choisi par l'hôte)</legend>
        <label>Taille de la carte
          <select name="size">
            <option value="128">128 × 128</option><option value="192">192 × 192</option>
            <option value="256">256 × 256</option><option value="384">384 × 384</option>
            <option value="512">512 × 512</option><option value="640">640 × 640</option>
            <option value="768">768 × 768</option><option value="1024">1024 × 1024</option>
          </select></label>
        <label>Peuples <input type="number" name="fiefs" min="2" max="200" placeholder="4"></label>
        <label>Villageois par peuple <input type="number" name="villagers" min="1" max="2000" placeholder="10"></label>
        <label>Routes
          <select name="roads">
            <option value="">vers les châteaux proches</option>
            <option value="ring">en anneau (l'original)</option>
          </select></label>
        <label>Vitesse <input type="number" name="speed" min="5" max="30" placeholder="10"></label>
        <label>Graine <input type="number" name="seed" min="0" placeholder="au hasard"></label>
        <label>Attendre les plus lents
          <select name="wait">
            <option value="">sans limite</option>
            <option value="1.5">1,5 × le plus rapide</option>
            <option value="2">2 × le plus rapide</option>
            <option value="3">3 × le plus rapide</option>
          </select></label>
      </fieldset>
      <div class="buttons">
        <button type="button" id="leave">Quitter</button>
        <button type="button" id="room-start">Jouer</button>
      </div>
    </div>
    <p class="error" id="lobby-error"></p>
  </div>
  <form hidden>
    <h1>Vendetta</h1>
    <label>Taille de la carte
      <select name="size">
        <option value="128">128 × 128</option><option value="192">192 × 192</option>
        <option value="256">256 × 256</option><option value="384">384 × 384</option>
        <option value="512">512 × 512</option><option value="640">640 × 640</option>
        <option value="768">768 × 768</option><option value="1024">1024 × 1024</option>
      </select></label>
    <label>Peuples <input type="number" name="fiefs" min="2" max="200" placeholder="4"></label>
    <label>Villageois par peuple <input type="number" name="villagers" min="1" max="2000" placeholder="10"></label>
    <label>Routes
      <select name="roads">
        <option value="">vers les châteaux proches</option>
        <option value="ring">en anneau (l'original)</option>
      </select></label>
    <label>Vitesse <input type="number" name="speed" min="5" max="30" placeholder="10"></label>
    <label>Graine <input type="number" name="seed" min="0" placeholder="au hasard"></label>
    <fieldset><legend>Tests</legend>
      <label>Invincible <input type="checkbox" name="god"></label>
      <label>Performances <input type="checkbox" name="perf"></label>
    </fieldset>
    <div class="buttons">
      <button type="button" id="back">Retour</button>
      <button type="submit">Jouer</button>
    </div>
  </form>
</div>
<div id="loading" hidden>
  <div id="frame"><div id="bar"></div><img id="art" alt=""></div>
</div>
<div id="bubble" hidden>Chargement…</div>
<div id="ingame" hidden>
  <div class="panel">
    <div class="actions">
      <h1>Menu</h1>
      <p class="note" id="ingame-note"></p>
      <button type="button" id="ingame-resume">Reprendre</button>
      <button type="button" id="ingame-quit">Quitter vers le menu</button>
    </div>
    <div class="settings">
    <fieldset>
      <legend>Sons</legend>
      <label><input type="checkbox" id="music-on"> Musiques <input type="range" id="music-volume" min="0" max="100"></label>
      <label><input type="checkbox" id="effects-on"> Bruitages <input type="range" id="effects-volume" min="0" max="100"></label>
    </fieldset>
    <fieldset>
      <legend>Affichage</legend>
      <div class="row">Zoom de la carte <span><button type="button" data-command="2">−</button><button type="button" data-command="3">+</button></span></div>
      <div class="row" id="ui-size">Taille de l'interface <span><button type="button" data-command="4">−</button><button type="button" data-command="5">+</button></span></div>
      <div class="row">Interface
        <select id="layout">
          <option value="auto">Automatique</option>
          <option value="touch">Tactile</option>
          <option value="desktop">Bureau</option>
        </select>
      </div>
      <div class="row" id="fullscreen-row">Plein écran <input type="checkbox" id="fullscreen"></div>
    </fieldset>
    <fieldset>
      <legend>Jeu</legend>
      <div class="row">Vitesse <span id="speed-value"></span></div>
      <input type="range" id="speed" min="5" max="30">
    </fieldset>
    </div>
  </div>
</div>
<div id="errors" hidden></div>
<div id="netstatus" hidden></div>
<canvas id="glcanvas" class="waiting" tabindex="1" oncontextmenu="event.preventDefault()"></canvas>
<!-- build-web.sh appends ?v=<hash> to these two URLs so they can be cached for good -->
<script src="mq_js_bundle.js"></script>
<script>
  // Digits are the object keys: keep Firefox's quick find (' is 4 on AZERTY, /) and similar
  // shortcuts from taking them.
  window.addEventListener("keydown", (e) => {
    if (e.target.closest && e.target.closest("form, #lobby")) return; // the menu's fields
    if (/^(Digit\d|Quote|Slash)$/.test(e.code) && !e.ctrlKey && !e.metaKey) e.preventDefault();
  });
</script>
<script>
  // miniquad's copy, cut and paste handlers (on the window) take the clipboard for the game:
  // in the menus, the browser keeps it (stopped in the capture phase, before they run).
  for (const type of ["copy", "cut", "paste"]) {
    window.addEventListener(type, (e) => {
      if (e.target.closest && e.target.closest("#menu, #ingame")) e.stopImmediatePropagation();
    }, true);
  }
  // Right click is a game action, not the browser menu (which the pre-game menus keep).
  document.addEventListener("contextmenu", (e) => {
    if (!e.target.closest("#menu, #ingame")) e.preventDefault();
  });

  const loadingScreen = document.getElementById("loading");
  const bar = document.getElementById("bar");
  const bubble = document.getElementById("bubble");

  const errorBox = document.getElementById("errors");
  errorBox.addEventListener("click", () => (errorBox.hidden = true));
  function showError(text) {
    errorBox.textContent += (errorBox.textContent ? "\n" : "") + text;
    errorBox.hidden = false;
  }
  window.addEventListener("error", (e) => showError(e.message + (e.filename ? ` (${e.filename.split("/").pop()}:${e.lineno})` : "")));
  window.addEventListener("unhandledrejection", (e) => showError("Promise: " + (e.reason?.stack || e.reason)));
  // Downloads that last on a poor connection (a phone's, a tunnel's): one that receives
  // nothing for much longer than the server usually takes to answer (5 times as long, from
  // 1 s to 8 s) is cut and taken up again where it stopped (a Range request, the files never
  // change under their URLs), at once, then after a pause growing to 2 s.
  // Only an answer like "not found" fails. At most 6 at a time, the browsers' connections to
  // a server: queued, the others would seem stalled. While the connection struggles, the
  // loading screen counts the attempts made again.
  // How long the server takes to answer, on average (ms).
  let answerMs = 700;
  const stallMs = () => Math.min(Math.max(5 * answerMs, 1000), 8000);
  const MAX_DOWNLOADS = 6;
  const downloadQueue = [];
  let downloading = 0;
  let downloadRetries = 0;
  const netStatus = document.getElementById("netstatus");
  function noteRetry() {
    downloadRetries++;
    netStatus.textContent = `Connexion instable : ${downloadRetries} reprise${downloadRetries > 1 ? "s" : ""}`;
    netStatus.hidden = false;
  }
  // The bytes at `url`; `onBytes(n)` as they come, `onSize(n)` when their number is known.
  function download(url, onBytes = () => {}, onSize = () => {}) {
    return new Promise((resolve, reject) => {
      downloadQueue.push(() => downloadNow(url, onBytes, onSize).then(resolve, reject));
      nextDownload();
    });
  }
  function nextDownload() {
    while (downloading < MAX_DOWNLOADS && downloadQueue.length) {
      downloading++;
      downloadQueue.shift()().finally(() => {
        downloading--;
        nextDownload();
      });
    }
  }
  async function downloadNow(url, onBytes, onSize) {
    let chunks = [];
    let have = 0;
    for (let attempt = 0; ; attempt++) {
      const abort = new AbortController();
      let seen = performance.now();
      const watch = setInterval(() => performance.now() - seen > stallMs() && abort.abort(), 250);
      try {
        const headers = have > 0 ? { Range: `bytes=${have}-` } : {};
        const response = await fetch(url, { signal: abort.signal, headers });
        answerMs = 0.9 * answerMs + 0.1 * (performance.now() - seen);
        seen = performance.now();
        if (response.status === 404 || response.status === 403 || response.status === 410) {
          throw Object.assign(new Error(`${url.split("?")[0]}: ${response.status}`), { final: true });
        }
        if (!response.ok) throw new Error(`${response.status}`);
        if (have === 0 && response.headers.get("Content-Length")) onSize(Number(response.headers.get("Content-Length")));
        // a server without ranges sends it all again
        if (have > 0 && response.status !== 206) {
          onBytes(-have);
          chunks = [];
          have = 0;
        }
        const reader = response.body.getReader();
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          seen = performance.now();
          chunks.push(value);
          have += value.length;
          onBytes(value.length);
        }
        const bytes = new Uint8Array(have);
        let at = 0;
        for (const c of chunks) {
          bytes.set(c, at);
          at += c.length;
        }
        return bytes;
      } catch (e) {
        if (e.final) throw e;
        noteRetry();
        await new Promise((r) => setTimeout(r, Math.min(250 * attempt, 2000)));
      } finally {
        clearInterval(watch);
      }
    }
  }
  // the game's panics and errors go to console.error
  {
    const error = console.error.bind(console);
    console.error = (...args) => {
      error(...args);
      showError(args.map((a) => (a instanceof Error ? a.stack || a.message : String(a))).join(" "));
    };
  }

  // Progress in bytes: the game's own download (measured here), then the files the game
  // downloads (reported by it). Until it reports, its share is estimated from the manifest.
  const bytes = { wasm: 0, wasmTotal: 0, game: 0, gameTotal: 0 };
  let shown = 0;
  function showProgress() {
    const total = bytes.wasmTotal + bytes.gameTotal;
    // (the bundles' bytes count before the game takes its files out of them)
    const game = Math.max(bytes.game, Math.min(bundleBytes, bytes.gameTotal));
    const pct = total > 0 ? (100 * (bytes.wasm + game)) / total : 0;
    shown = Math.max(shown, Math.min(pct, 100)); // never goes backwards
    bar.style.width = shown + "%";
    bar.style.background = `hsl(${shown * 1.2}, 100%, 45%)`; // smooth red to green
  }

  // The files the game loads as it starts come in a few bundles (see bundle.py), all
  // downloaded at once as the page opens, alongside the game itself; such a file is then a
  // slice of its bundle. Without the bundles' index, every file comes alone.
  const bundled = new Map();
  let bundleBytes = 0;
  const bundlesReady = download("bundles.json")
    .then((bytes) => {
      for (const b of JSON.parse(new TextDecoder().decode(bytes)).bundles) {
        const data = download(b.url, (n) => {
          bundleBytes += n;
          showProgress();
        });
        for (const [path, offset, size] of b.files) bundled.set(path, [data, offset, size]);
      }
    })
    .catch((e) => console.warn("no bundles:", e));
  // A file the game asks for (its URL is `assets/<path>?v=<hash>`): out of its bundle, which
  // is let go once all its files are taken, or downloaded alone.
  function gameFile(url) {
    return bundlesReady.then(() => {
      let path = url.replace(/^assets\//, "").split("?")[0];
      try {
        path = decodeURIComponent(path);
      } catch (e) {}
      const entry = bundled.get(path);
      if (!entry) return download(url);
      bundled.delete(path);
      const [data, offset, size] = entry;
      return data.then((bytes) => bytes.slice(offset, offset + size));
    });
  }

  // The manifest gives a random artwork (the bar works without it) and the estimate:
  // data files plus the image folders the game always loads (see Manifest in assets.rs).
  fetch("assets/manifest.txt")
    .then((r) => r.text())
    .then((text) => {
      const entries = text.split("\n").filter((l) => l).map((l) => {
        const [path, size, hash] = l.split("\t");
        return { path, size: Number(size) || 0, url: "assets/" + path + (hash ? "?v=" + hash : "") };
      });
      const arts = entries.filter((e) => e.path.startsWith("Images/Chargement/"));
      if (arts.length > 0) {
        const pick = arts[Math.floor(Math.random() * arts.length)];
        document.getElementById("art").src = pick.url;
      }
      if (bytes.gameTotal === 0) {
        const lower = (p) => p.toLowerCase();
        const isData = (p) =>
          (/\.(ini|txt|ia)$/.test(lower(p)) || lower(p).startsWith("cartes/") || lower(p).startsWith("sons/")) &&
          !/(apercu|carte)\.png$/.test(lower(p));
        const folders = ["Images/Batiments/", "Images/Persos/", "Images/Apparences/", "Images/Effets/",
                         "Images/Boutons/", "Images/Decors/", "Images/Terrains/",
                         "Images/Fenetres/Fenetre-", "Images/Ressources/", "Images/Curseurs/"];
        bytes.gameTotal = entries
          .filter((e) => isData(e.path) || folders.some((f) => e.path.startsWith(f)))
          .reduce((sum, e) => sum + e.size, 0);
        showProgress();
      }
    })
    .catch(() => {});

  // The bubble follows the cursor, like the original's info-bubbles.
  document.addEventListener("mousemove", (e) => {
    bubble.style.left = e.clientX + 24 + "px";
    bubble.style.top = e.clientY + 20 + "px";
  });

  // `#` separates lines; a line starting with `&` is red.
  function showMessage(text) {
    bubble.replaceChildren();
    text.split("#").forEach((line, i) => {
      if (i > 0) bubble.append("\n");
      const span = document.createElement("span");
      if (line.startsWith("&")) {
        span.className = "red";
        line = line.slice(1);
      }
      span.textContent = line;
      bubble.append(span);
    });
    bubble.style.display = text ? "" : "none";
  }

  // Called by the game while it loads (see client/src/loading.rs).
  miniquad_add_plugin({
    name: "vendetta_loading",
    version: 1,
    register_plugin: (importObject) => {
      // The game's files, with the downloads above rather than miniquad's (which never
      // time out nor resume); failing, the game gets miniquad's failure.
      importObject.env.fs_load_file = (ptr, len) => {
        const url = UTF8ToString(ptr, len);
        const id = FS.unique_id++;
        gameFile(url).then(
          (bytes) => (FS.loaded_files[id] = bytes),
          (e) => (console.warn(e), (FS.loaded_files[id] = null)),
        ).then(() => wasm_exports.file_loaded(id));
        return id;
      };
      importObject.env.vendetta_loading = (done, total, ptr, len) => {
        if (total > 0) {
          // until the game knows its sizes, keep the estimate
          bytes.game = done;
          bytes.gameTotal = total;
        }
        showProgress();
        showMessage(UTF8ToString(ptr, len));
      };
      importObject.env.vendetta_loaded = () => {
        loadingScreen.remove();
        netStatus.hidden = true;
        bubble.remove();
      };

      // Persistent blobs (see client/src/storage.rs and `storageReady` below), read from
      // memory; writes go on to IndexedDB in the background.
      let pendingRead = null;
      importObject.env.vendetta_store = (kptr, klen, ptr, len) => {
        const key = UTF8ToString(kptr, klen);
        // the only copy: it goes to the worker, which hands it back for `blobs`
        const value = new Uint8Array(wasm_memory.buffer, ptr, len).slice();
        if (worker) persist(key, value);
        else blobs.set(key, value);
      };
      importObject.env.vendetta_stored_size = (kptr, klen) => {
        const key = UTF8ToString(kptr, klen);
        pendingRead = blobs.get(key);
        return pendingRead ? pendingRead.length : 0;
      };
      // A precise clock for the #perf timings (macroquad's uses Date.now(), to the millisecond).
      importObject.env.vendetta_now = () => performance.now() / 1000;
      // Options in the URL's hash (see client/src/options.rs), read like a stored value.
      importObject.env.vendetta_hash_size = () => {
        pendingRead = new TextEncoder().encode(startHash || "");
        return pendingRead.length;
      };
      // Network play (see client/src/net.rs and the lobby below): messages for the game wait
      // in `netInbox`.
      importObject.env.vendetta_net_send = (ptr, len) => {
        if (socket && socket.readyState === WebSocket.OPEN) socket.send(UTF8ToString(ptr, len));
      };
      importObject.env.vendetta_net_size = () => {
        const msg = netInbox.shift();
        if (msg === undefined) return 0;
        pendingRead = new TextEncoder().encode(msg);
        return pendingRead.length;
      };
      // The game loads behind the menus, then waits for one to start it (`begin`).
      importObject.env.vendetta_started = () => startHash !== null;
      // The in-game menu (see above and client/src/storage.rs).
      importObject.env.vendetta_open_menu = openIngameMenu;
      importObject.env.vendetta_menu_open = () => !ingame.hidden;
      importObject.env.vendetta_menu_command = () => menuCommands.shift() || 0;
      importObject.env.vendetta_quit = () => {
        writesDone().then(() => {
          if (socket) socket.close();
          setHash(hashItems().filter((o) => o !== "play" && !o.startsWith("room=")));
          location.reload();
        });
      };
      importObject.env.vendetta_speed = (speed, network) => showSpeed(speed, !!network);
      importObject.env.vendetta_layout = () => ({ touch: 1, desktop: 2 })[layoutChoice] || 0;
      importObject.env.vendetta_volume = (kind) => {
        const k = kind === 0 ? "music" : "effects";
        return sound[k] ? sound[k + "Volume"] / 100 : 0;
      };
      // The touch interface on phones and tablets (see client/src/layout.rs).
      importObject.env.vendetta_touch_screen = () => matchMedia("(pointer: coarse)").matches;
      // after the pending writes, so that none is lost
      window.addEventListener("hashchange", () => writesDone().then(() => location.reload()));
      importObject.env.vendetta_read = (ptr) => {
        new Uint8Array(wasm_memory.buffer, ptr, pendingRead.length).set(pendingRead);
        pendingRead = null;
      };
    },
  });

  // The options in the URL's hash (see client/src/options.rs), which the game reads as it
  // starts. `play` starts it at once; without it, the pre-game menu shows them and every change
  // rewrites the hash in place. `new` (a new world) applies to one start only: it is taken out
  // of the address, so that reloading resumes that world.
  const hashItems = () => decodeURIComponent(location.hash.slice(1)).split("&").filter((o) => o);
  const setHash = (items) => history.replaceState(null, "", location.pathname + location.search + (items.length ? "#" + items.join("&") : ""));
  // The options of the game chosen in the menus; none yet.
  let startHash = null;
  // The settings the game in progress was started with, for "Continuer la partie".
  const lastKey = "vendetta-game";
  // This page's build (the game's hash, set by build-web.sh): the server lets only pages of the
  // same build play together, as a different one would not keep the same world.
  const build = "dev";
  // Network play: the server connection, kept once the game starts, and the messages waiting
  // for the game (see the lobby below).
  let socket = null;
  const netInbox = [];
  let netStarted = false;
  // The game's canvas, hidden while it loads behind the menus; once shown it takes the keyboard
  // (the focus miniquad gave it at load does not hold on a hidden element).
  function showGame() {
    const canvas = document.getElementById("glcanvas");
    canvas.classList.remove("waiting");
    canvas.focus();
  }
  // The in-game menu, which the game opens (F10, Escape, its Menu buttons): a solo game is
  // paused behind it, a network one goes on (the character stands still). Leaving goes back
  // to the pre-game menus once the game is saved; a network game can be joined again with
  // its room's link.
  const ingame = document.getElementById("ingame");
  const menuCommands = [];
  const networkGame = () => (startHash || "").split("&").some((o) => o.startsWith("me="));
  function openIngameMenu() {
    if (!ingame.hidden) return;
    document.getElementById("ingame-note").textContent = networkGame()
      ? "La partie continue : votre personnage attend."
      : "Partie en pause";
    showUiSize();
    fullscreen.checked = !!document.fullscreenElement;
    ingame.hidden = false;
    document.getElementById("ingame-resume").focus();
  }
  function closeIngameMenu() {
    ingame.hidden = true;
    showGame();
  }
  document.getElementById("ingame-resume").addEventListener("click", closeIngameMenu);
  ingame.addEventListener("click", (e) => e.target === ingame && closeIngameMenu());
  ingame.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      e.preventDefault();
      closeIngameMenu();
    }
  });
  document.getElementById("ingame-quit").addEventListener("click", (e) => {
    for (const b of ingame.querySelectorAll("button")) b.disabled = true;
    e.target.textContent = "Enregistrement…";
    menuCommands.push(1);
  });
  // Sound settings, kept apart from any game (a new one keeps them): music and sound
  // effects, each on or off with its volume, which the game reads every frame.
  const soundKey = "vendetta-sound";
  const sound = { music: true, musicVolume: 100, effects: true, effectsVolume: 100 };
  try {
    Object.assign(sound, JSON.parse(localStorage.getItem(soundKey)) || {});
  } catch (e) {}
  for (const kind of ["music", "effects"]) {
    const on = document.getElementById(kind + "-on");
    const volume = document.getElementById(kind + "-volume");
    on.checked = sound[kind];
    volume.value = sound[kind + "Volume"];
    const changed = () => {
      sound[kind] = on.checked;
      sound[kind + "Volume"] = Number(volume.value);
      volume.disabled = !on.checked;
      try {
        localStorage.setItem(soundKey, JSON.stringify(sound));
      } catch (e) {}
    };
    on.addEventListener("change", changed);
    volume.addEventListener("input", changed);
    volume.disabled = !on.checked;
  }
  // Display settings: the map's zoom and the interface's size are the game's (the menu asks it
  // for a step); the interface (touch or desktop) is the page's, read by the game every frame,
  // which also takes it over the address's `layout=`; full screen is the browser's.
  const layoutKey = "vendetta-layout";
  let layoutChoice = "auto";
  try {
    layoutChoice = localStorage.getItem(layoutKey) || "auto";
  } catch (e) {}
  const layoutSelect = document.getElementById("layout");
  layoutSelect.value = layoutChoice;
  const touchLayout = () =>
    layoutChoice === "touch" ||
    (layoutChoice === "auto" && ((startHash || "").includes("layout=touch") || (!(startHash || "").includes("layout=desktop") && matchMedia("(pointer: coarse)").matches)));
  // the touch interface sizes itself
  const showUiSize = () => (document.getElementById("ui-size").hidden = touchLayout());
  layoutSelect.addEventListener("change", () => {
    layoutChoice = layoutSelect.value;
    try {
      localStorage.setItem(layoutKey, layoutChoice);
    } catch (e) {}
    showUiSize();
  });
  for (const b of ingame.querySelectorAll("[data-command]")) {
    b.addEventListener("click", () => menuCommands.push(Number(b.dataset.command)));
  }
  const fullscreen = document.getElementById("fullscreen");
  document.getElementById("fullscreen-row").hidden = !document.documentElement.requestFullscreen;
  fullscreen.addEventListener("change", () => {
    if (fullscreen.checked) document.documentElement.requestFullscreen().catch(() => (fullscreen.checked = false));
    else if (document.fullscreenElement) document.exitFullscreen();
  });
  document.addEventListener("fullscreenchange", () => (fullscreen.checked = !!document.fullscreenElement));
  // The game's speed (the original's Vitesse, ticks per second): the game tells it, a solo
  // game takes a new one at once; a network game's is the room's.
  const speedInput = document.getElementById("speed");
  const speedValue = document.getElementById("speed-value");
  function showSpeed(speed, network) {
    speedInput.value = speed;
    speedInput.hidden = network;
    speedValue.textContent = speed + (network ? " (celle de la partie)" : "");
  }
  speedInput.addEventListener("input", () => {
    speedValue.textContent = speedInput.value;
    menuCommands.push(100 + Number(speedInput.value));
  });
  // On a touch screen, the game takes the whole screen (no address bar) from the first
  // button pressed in the menus (it needs a press).
  document.getElementById("menu").addEventListener("click", (e) => {
    if (e.target.tagName === "BUTTON" && matchMedia("(pointer: coarse)").matches && !document.fullscreenElement) {
      document.documentElement.requestFullscreen?.().catch(() => {});
    }
  });
  function begin(items) {
    const kept = items.filter((o) => o !== "new");
    try {
      localStorage.setItem(lastKey, kept.filter((o) => o !== "play").join("&"));
    } catch (e) {}
    // a solo character takes the name last used in the lobby (unless the hash gives one)
    let name = null;
    try {
      name = localStorage.getItem("vendetta-name");
    } catch (e) {}
    const named = name && !items.some((o) => o.startsWith("names="));
    startHash = (named ? [...items, "names=" + encodeURIComponent(name)] : items).join("&");
    setHash(kept);
    document.getElementById("menu").hidden = true;
    loadingScreen.hidden = false;
    bubble.hidden = false;
    showGame();
  }

  // Persistent blobs: gzip-compressed in IndexedDB (database "vendetta", store "blobs"),
  // which unlike local storage holds big worlds. They are all read into `blobs` before the
  // game starts, so that it reads them synchronously. A worker compresses and stores writes,
  // off the game's thread; while one is in progress, only the newest value of each key waits.
  // Storage may be unavailable (private browsing): then nothing persists.
  const blobs = new Map();
  let db = null;
  const openDb = () =>
    new Promise((resolve, reject) => {
      const open = indexedDB.open("vendetta", 1);
      open.onupgradeneeded = () => open.result.createObjectStore("blobs");
      open.onsuccess = () => resolve(open.result);
      open.onerror = () => reject(open.error);
    });
  const transform = async (data, stream) =>
    new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(stream)).arrayBuffer());
  const request = (db, mode, op) =>
    new Promise((resolve, reject) => {
      const tx = db.transaction("blobs", mode);
      const req = op(tx.objectStore("blobs"));
      tx.oncomplete = () => resolve(req.result);
      tx.onerror = tx.onabort = () => reject(tx.error);
    });
  const workerCode = `
    ${openDb.toString().replace(/^/, "const openDb = ")};
    ${transform.toString().replace(/^/, "const transform = ")};
    ${request.toString().replace(/^/, "const request = ")};
    const db = openDb();
    onmessage = async ({ data: { key, value } }) => {
      try {
        const packed = await transform(value, new CompressionStream("gzip"));
        await request(await db, "readwrite", (s) => s.put(packed, key));
        postMessage({ key, value }, [value.buffer]);
      } catch (e) {
        postMessage({ key, value, error: String(e) }, [value.buffer]);
      }
    };`;
  let worker = null;
  const waiting = new Map(); // key → newest value not yet sent to the worker
  const busy = new Set();
  let onIdle = [];
  const send = (key) => {
    if (busy.has(key) || !waiting.has(key)) return;
    const value = waiting.get(key);
    waiting.delete(key);
    busy.add(key);
    worker.postMessage({ key, value }, [value.buffer]);
  };
  /// Hands `value` to the worker; `blobs` gets it back once stored (the game reads blobs only
  /// as it starts, so the old value meanwhile does not matter).
  const persist = (key, value) => {
    waiting.set(key, value);
    send(key);
  };
  /// Resolves once every write is stored.
  const writesDone = () =>
    busy.size === 0 && waiting.size === 0 ? Promise.resolve() : new Promise((r) => onIdle.push(r));
  const storageReady = (async () => {
    try {
      db = await openDb();
      const [keys, values] = await Promise.all([
        request(db, "readonly", (s) => s.getAllKeys()),
        request(db, "readonly", (s) => s.getAll()),
      ]);
      for (let i = 0; i < keys.length; i++) {
        blobs.set(keys[i], await transform(values[i], new DecompressionStream("gzip")));
      }
      worker = new Worker(URL.createObjectURL(new Blob([workerCode], { type: "text/javascript" })));
      worker.onmessage = ({ data: { key, value, error } }) => {
        if (error) console.warn("cannot save " + key + ":", error);
        if (!waiting.has(key)) blobs.set(key, value);
        busy.delete(key);
        send(key);
        if (busy.size === 0 && waiting.size === 0) onIdle.splice(0).forEach((r) => r());
      };
    } catch (e) {
      console.warn("no storage:", e);
    }
  })();

  // Download the game ourselves to show its progress, then hand it to miniquad's loader.
  const startGame = async () => {
    try {
      bytes.wasmTotal = 2000000;
      const wasm = await download("client.wasm", (n) => {
        bytes.wasm += n;
        bytes.wasmTotal = Math.max(bytes.wasmTotal, bytes.wasm);
        showProgress();
      }, (size) => (bytes.wasmTotal = size));
      bytes.wasmTotal = bytes.wasm;
      await storageReady;
      load(URL.createObjectURL(new Blob([wasm], { type: "application/wasm" })));
    } catch (e) {
      showMessage("&Erreur#" + e.message);
    }
  };

  // The pre-game menu: the form mirrors the hash; flags are checkboxes, other keys values.
  {
    const form = document.querySelector("#menu form");
    const fields = ["size", "fiefs", "villagers", "roads", "speed", "seed"];
    const flags = ["god", "perf"];
    const fill = () => {
      const items = hashItems();
      const value = (k) => (items.find((o) => o.startsWith(k + "=")) || "").slice(k.length + 1);
      for (const k of fields) form.elements[k].value = value(k);
      if (!form.elements.size.value) form.elements.size.value = "128";
      for (const k of flags) form.elements[k].checked = items.includes(k);
    };
    // the menu's items, the hash's other ones kept (e.g. `test`)
    const items = () => {
      const ours = (o) => fields.some((k) => o.startsWith(k + "=")) || flags.includes(o) || o === "play" || o === "new";
      const out = hashItems().filter((o) => !ours(o));
      for (const k of fields) {
        const v = String(form.elements[k].value).trim();
        if (v && !(k === "size" && v === "128")) out.push(k + "=" + v);
      }
      for (const k of flags) if (form.elements[k].checked) out.push(k);
      return out;
    };
    form.addEventListener("input", () => setHash(items()));
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      begin([...items(), "play", "new"]);
    });
    document.getElementById("continue").addEventListener("click", () => {
      let last = "";
      try {
        last = localStorage.getItem(lastKey) || "";
      } catch (e) {}
      begin([...last.split("&").filter((o) => o), "play"]);
    });
    // The main menu ("Continuer", greyed without a saved game; "Nouveau") and the form.
    const main = document.getElementById("main");
    const show = (onForm) => {
      main.hidden = onForm;
      form.hidden = !onForm;
    };
    document.getElementById("new").addEventListener("click", () => show(true));
    document.getElementById("back").addEventListener("click", () => show(false));

    // Network play (see the server crate): enter a room by creating one or with its code (or a
    // link with `#room=CODE`), pick a fief; the host sets the world and starts.
    const $ = (id) => document.getElementById(id);
    const lobby = $("lobby");
    const settings = $("room-settings");
    const nameKey = "vendetta-name";
    const fail = (text) => ($("lobby-error").textContent = text);
    const inRoom = (yes) => {
      $("enter").hidden = yes;
      $("room").hidden = !yes;
    };
    const send = (msg) => socket && socket.readyState === WebSocket.OPEN && socket.send(JSON.stringify(msg));
    // the world's options, and how long to wait for slow players to load (see the server)
    const roomFields = [...fields, "wait"];
    const roomValue = (items, k) => (items.find((o) => o.startsWith(k + "=")) || "").slice(k.length + 1);
    // The room we are in and our token in it (see the server), kept to come back to it.
    const netKey = "vendetta-net";
    const netSlot = () => {
      try {
        return JSON.parse(localStorage.getItem(netKey)) || {};
      } catch (e) {
        return {};
      }
    };
    const setNetSlot = (slot) => {
      try {
        if (slot) localStorage.setItem(netKey, JSON.stringify(slot));
        else localStorage.removeItem(netKey);
      } catch (e) {}
    };
    let netRoom = null;
    const showLobby = (msg) => {
      netRoom = msg.room;
      setNetSlot({ room: msg.room, token: msg.token });
      setHash(["room=" + msg.room]);
      inRoom(true);
      $("room-code").textContent = msg.room;
      $("room-link").href = $("room-link").textContent = location.href;
      const host = msg.you === msg.host;
      for (const k of roomFields) {
        const el = settings.elements[k];
        if (el !== document.activeElement) el.value = roomValue(msg.items, k) || (k === "size" ? "128" : "");
        el.disabled = !host;
      }
      const fiefs = Number(roomValue(msg.items, "fiefs")) || 4;
      $("players").replaceChildren(
        ...msg.players.map((p, k) => {
          const row = document.createElement("tr");
          if (!p.online) row.className = "offline";
          const name = document.createElement("td");
          name.textContent = p.name + (k === msg.host ? " (hôte)" : "") + (k === msg.you ? " (vous)" : "");
          const fief = document.createElement("td");
          if (k === msg.you) {
            const select = document.createElement("select");
            for (let f = 1; f <= fiefs; f++) select.add(new Option("Peuple " + f, f, false, f === p.fief));
            select.addEventListener("change", () => send({ t: "fief", fief: Number(select.value) }));
            fief.append(select);
          } else {
            fief.textContent = "Peuple " + p.fief;
          }
          row.append(name, fief);
          return row;
        }),
      );
      $("room-start").hidden = !host;
    };
    // The world: the room's options, its seed, everyone's fief and our place.
    const startNet = (msg) => {
      netStarted = true;
      const resume = msg.resume ? ["resume"] : [];
      startHash = [...msg.items, "seed=" + msg.seed, "players=" + msg.players.join("+"), "names=" + msg.names.map(encodeURIComponent).join("+"), "me=" + msg.you, "room=" + netRoom, ...resume, "play"].join("&");
      document.getElementById("menu").hidden = true;
      loadingScreen.hidden = false;
      bubble.hidden = false;
      showGame();
    };
    // Connects to the server (`ws` next to the page), then sends `first`.
    const connect = (first) => {
      fail("");
      if (socket) socket.close();
      const url = new URL("ws", location.href);
      url.protocol = url.protocol === "https:" ? "wss:" : "ws:";
      url.hash = url.search = "";
      const ws = new WebSocket(url);
      socket = ws;
      ws.onopen = () => send({ ...first, version: build });
      ws.onerror = () => fail("Le serveur ne répond pas.");
      ws.onclose = () => {
        if (socket !== ws) return;
        socket = null;
        if (netStarted) {
          // tell the game once, then try again and again (1 s, 2 s… up to 15 s apart)
          if (ws.opened) netInbox.push('{"t":"closed"}');
          retry = Math.min(retry * 2 || 1, 15);
          setTimeout(() => connect({ t: "rejoin", room: netRoom, token: netSlot().token }), retry * 1000);
        } else inRoom(false);
      };
      ws.onmessage = ({ data }) => {
        ws.opened = true;
        if (netStarted) {
          retry = 0;
          return netInbox.push(data);
        }
        const msg = JSON.parse(data);
        if (msg.t === "error" && msg.code === "version") fail(msg.message.charAt(0).toUpperCase() + msg.message.slice(1) + ".");
        else if (msg.t === "error" && first.t === "rejoin") {
          // that game is over for us: join the room anew (its lobby, if it is still one)
          setNetSlot(null);
          openLobby(first.room, true);
        } else if (msg.t === "error") fail(msg.message.charAt(0).toUpperCase() + msg.message.slice(1) + ".");
        else if (msg.t === "lobby") showLobby(msg);
        else if (msg.t === "start") startNet(msg);
      };
    };
    let retry = 0;
    // Leaving the page ends the connection, so that the others are told at once (a page kept
    // in the back-forward cache would otherwise keep it open, unanswered).
    window.addEventListener("pagehide", () => {
      const ws = socket;
      socket = null;
      if (ws) ws.close();
    });
    const name = () => {
      const n = $("name").value.trim();
      if (!n) fail("Choisissez un nom.");
      try {
        localStorage.setItem(nameKey, n);
      } catch (e) {}
      return n;
    };
    $("create").addEventListener("click", () => name() && connect({ t: "create", name: name() }));
    $("join").addEventListener("click", () => {
      const code = $("code").value.trim().toUpperCase();
      if (!code) return fail("Entrez le code de la partie.");
      if (name()) connect({ t: "join", room: code, name: name() });
    });
    $("leave").addEventListener("click", () => {
      setNetSlot(null);
      const ws = socket;
      socket = null;
      if (ws) ws.close();
      inRoom(false);
      setHash([]);
    });
    $("room-start").addEventListener("click", () => send({ t: "start" }));
    settings.addEventListener("input", () => {
      const items = [];
      for (const k of roomFields) {
        const v = String(settings.elements[k].value).trim();
        if (v && !(k === "size" && v === "128")) items.push(k + "=" + v);
      }
      send({ t: "settings", items });
    });
    // `fresh`: not back to a game in progress, even with a token for it.
    const openLobby = (code, fresh) => {
      main.hidden = form.hidden = true;
      lobby.hidden = false;
      try {
        $("name").value = localStorage.getItem(nameKey) || "";
      } catch (e) {}
      $("code").value = code;
      const slot = netSlot();
      if (!fresh && code && slot.room === code.toUpperCase() && slot.token) {
        netRoom = slot.room;
        connect({ t: "rejoin", room: slot.room, token: slot.token });
      } else if (code && $("name").value.trim()) $("join").click();
    };
    $("lobby-back").addEventListener("click", () => {
      lobby.hidden = true;
      show(false);
    });
    $("multi").addEventListener("click", () => openLobby(""));
    // a page opened as a file has no server
    $("multi").hidden = location.protocol === "file:";

    // The game loads at once, behind the menus.
    startGame();
    const room = roomValue(hashItems(), "room");
    if (hashItems().includes("play")) {
      begin(hashItems());
    } else if (room) {
      document.getElementById("menu").hidden = false;
      openLobby(room);
    } else {
      fill();
      document.getElementById("menu").hidden = false;
      // a link with settings opens on the form
      show(hashItems().some((o) => fields.some((k) => o.startsWith(k + "=")) || flags.includes(o)));
      storageReady.then(() => {
        document.getElementById("continue").disabled = !blobs.has("save");
      });
    }
  }
</script>
</body>
</html>
